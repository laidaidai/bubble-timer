/* 主色底上的文字统一用 --on-primary，深色主题下才看得清 */
.primary-button, .modal-confirm, .pause-button { color: var(--on-primary); }

/* ---- 公共顶栏（四个端口径一致，改这里全站生效） ---- */
.topbar { box-sizing: border-box; height: 88px; padding: 35px 14px 0; padding-top: max(35px, calc(env(safe-area-inset-top) + 3px)); display: flex; align-items: center; gap: 7px; color: var(--ink); background: var(--nav); border-bottom: 1.5px solid var(--edge); }
.topbar-title { flex: 1; min-width: 0; overflow: hidden; color: var(--ink); text-align: center; white-space: nowrap; font-size: 18px; font-weight: 900; line-height: 1.2; letter-spacing: 1px; }
.back-icon { flex: 0 0 35px; width: 35px !important; min-width: 35px !important; max-width: 35px; height: 30px; margin: 0; padding: 0; display: flex; align-items: center; justify-content: center; color: var(--ink); background: transparent; border: 0; font-size: 30px; font-weight: 300; line-height: 1; }
.topbar-spacer { flex: 0 0 35px; width: 35px; height: 30px; }

.app { min-height: 100vh; background:var(--bg);}
.page-content { padding: 8px 10px 32px; }
.config-scroll { height: calc(100vh - 88px); box-sizing: border-box; }
.report-scroll { height: calc(100vh - 88px); box-sizing: border-box; }

.hero-card, .progress-card, .timer-card, .module-card, .completion-card, .insight-card, .compare-card, .history-card, .template-card { background:var(--card); border:1px solid var(--edge); border-radius: 14px; box-shadow:3px 3.5px 0 var(--shadow); }

.target-row { display: flex; align-items: stretch; gap: 7px; }
.hero-card { flex: 1; min-width: 0; min-height: 75px; padding: 11px 12px; display: flex; align-items: center; justify-content: space-between; background:var(--accent-bg); }
.hero-main { display: flex; flex-direction: column; gap: 3px; }
.eyebrow { color:var(--text-mid); font-size: 11.5px; font-weight: 800; letter-spacing: 0.5px; }
.total-target { color:var(--ink); font-size: 32px; font-weight: 900; line-height: 1.1; }
.unit { margin-left: 4px; color:var(--text-warm); font-size: 12px; font-weight: 800; }
.hero-sub { color:var(--text-mid); font-size: 11px; font-weight: 600; }
.clock-badge { margin: 0; padding: 0; width: 42px; min-width: 42px; max-width: 42px; height: 42px; flex: 0 0 42px; display: flex; align-items: center; justify-content: center; color:var(--ink); background:var(--card); border:1px solid var(--edge); border-radius: 50%; box-shadow:2px 2.5px 0 var(--shadow); font-size: 19px; }
.history-button { display: inline-flex !important; flex: 0 0 79px; width: 79px !important; min-width: 79px !important; max-width: 79px; height: auto; margin: 0; padding: 0; align-items: center; justify-content: center; color:var(--ink); background:var(--cream-1); border:1px solid var(--edge); border-radius: 12px; box-shadow:2.5px 3px 0 var(--shadow); font-size: 12px; font-weight: 800; line-height: 1; }
.muted { color:var(--text-2); font-size: 11px; }

.control-bar { margin: 9px 0 13px; display: flex; align-items: center; gap: 6px; }
.primary-button { color:var(--ink); background:var(--primary); font-weight: 900; border:1px solid var(--edge); border-radius: 499.5px; }
.control-bar .primary-button { display: inline-flex; align-items: center; justify-content: center; width: 102px; margin: 0; padding: 11px 6px; font-size: 13.5px; line-height: 1; white-space: nowrap; box-shadow:2px 2.5px 0 var(--shadow); }
.primary-button text { margin-left: 4px; color:var(--warn-text); }
.primary-button[disabled] { opacity: .45; }

.section-title-row, .module-head, .module-foot, .progress-meta, .history-head { display: flex; align-items: center; justify-content: space-between; }
.section-title { color:var(--ink); font-size: 15px; font-weight: 900; }

.module-card { position: relative; margin: 9px 0; padding: 12px 13px 10px; border-radius: 20px; box-shadow:4.5px 5px 0 var(--shadow); transition: transform 200ms cubic-bezier(0.25, 0.8, 0.3, 1), box-shadow 160ms ease, background-color 160ms ease; will-change: transform; }
.module-card::after { content: ""; position: absolute; top: 14px; right: 52px; bottom: 14px; width: 1px; background:var(--line-2); }
.dragging { transform: scale(1.02); box-shadow:7px 9px 0 var(--shadow); }
.module-card.drag-mode { transition: transform 180ms cubic-bezier(0.25, 0.8, 0.3, 1); }
.module-card.dragging { background:var(--cream-3); border-color:var(--edge); transition: transform 0ms, box-shadow 100ms ease, background-color 100ms ease; }
.module-head { position: relative; margin-right: 55px; }
.module-name { position: relative; z-index: 1; width: 100%; color:var(--ink); font-size: 15px; font-weight: 900; }
.delete-button { position: absolute; z-index: 2; top: 0; right: -11px; display: inline-flex !important; flex: 0 0 28px; width: 28px !important; min-width: 28px !important; max-width: 28px; height: 28px; margin: 0; padding: 0; box-sizing: border-box; align-items: center; justify-content: center; color:var(--on-panel); background:var(--danger); border-radius: 50%; box-shadow:1.5px 2px 0 var(--shadow); font-size: 16px; font-weight: 700; line-height: 26px; }
.duration-row { width: auto; margin: 18px 55px 0 0; display: flex; align-items: flex-start; }
.stepper { flex: 0 0 95px; height: 29px; display: flex; overflow: hidden; border:1px solid var(--edge); border-radius: 499.5px; }
.round-small { flex: 1; width: auto !important; min-width: 0 !important; max-width: none; height: 27px; margin: 0; padding: 0; color:var(--ink); background:var(--cream-1); border: 0; border-radius: 0; font-size: 15px; font-weight: 800; line-height: 27px; }
.stepper .round-small:first-child { border-radius: 499.5px 0 0 499.5px; }
.stepper .round-small:last-child { border-radius: 0 499.5px 499.5px 0; }
.minute-input { flex: 0 0 32px; width: 32px; height: 27px; color:var(--ink); background:var(--cream-2); border-top: 0; border-bottom: 0; border-left:1px solid var(--edge); border-right:1px solid var(--edge); font-size: 15px; font-weight: 900; text-align: center; }
.slider-wrap { flex: 1; min-width: 0; margin: 7px 0 0 12px; }
.duration-slider { width: 100%; margin: 0; padding: 0; }
.slider-labels { margin: -1px 0 0; display: flex; justify-content: space-between; color:var(--text-3); font-size: 10px; }
.module-foot { position: absolute; top: 50%; right: 10px; width: 38px; height: 48px; display: flex; align-items: center; justify-content: center; transform: translateY(-50%); color:var(--text-3); font-size: 10px; }
.drag-handle { color:var(--text-3); font-size: 15px; line-height: 1; }
.template-list { margin-top: 10px; }
.template-list-label { margin-bottom: 5px; color:var(--text-2); font-size: 10.5px; }
.template-list-pills { display: flex; flex-wrap: wrap; gap: 6px; }
.template-pick { padding: 5px 9px; color:var(--text-mid); background:var(--card); border:1px solid var(--line-strong); border-radius: 499.5px; font-size: 11px; }
.template-pick.active { color:var(--on-panel); background:var(--panel); border-color:var(--edge); }
.template-add { color:var(--text-warm); background:var(--cream-2); border-style: dashed; }
.quick-templates { margin: 6px 0 1px; }
.module-switching { animation: module-switch-in 260ms ease-out both; }
@keyframes module-switch-in {
  from { opacity: .35; transform: translateX(9px) scale(.98); }
  to { opacity: 1; transform: translateX(0) scale(1); }
}

.on-track { color:var(--success-text); font-weight: 900; }
.overtime, .negative { color:var(--danger-text); font-weight: 900; }
.positive { color:var(--success-text); font-weight: 800; }

.report-page { padding: 8px 10px 32px; }

/* 总览 */
.rp-hero { padding: 15px 14px 12px; color: var(--on-panel); background: var(--panel); border: 1px solid var(--edge); border-radius: 14px; box-shadow: 3px 3.5px 0 var(--shadow); }
.rp-hero-meta { color: var(--on-panel-warm); font-size: 10px; font-weight: 700; }
.rp-dot { margin: 0 5px; }
.rp-hero-main { margin-top: 5px; display: flex; align-items: baseline; }
.rp-percent { font-size: 46px; font-weight: 900; line-height: 1; }
.rp-percent-unit { margin-left: 3px; font-size: 15px; font-weight: 900; }
.rp-percent-cap { margin-left: auto; color: var(--on-panel); opacity: .72; font-size: 10px; font-weight: 700; }
.rp-metrics { margin-top: 12px; display: flex; border-top: 1px solid rgba(255, 255, 255, .18); padding-top: 10px; }
.rp-metric { flex: 1; min-width: 0; }
.rp-metric + .rp-metric { padding-left: 10px; border-left: 1px solid rgba(255, 255, 255, .18); }
.rp-metric-v { color: var(--on-panel); font-size: 16px; font-weight: 900; line-height: 1.1; }
.rp-metric-k { margin-top: 3px; color: var(--on-panel); opacity: .66; font-size: 9.5px; }
.rp-metric-u { margin-left: 2px; font-size: 9px; opacity: .7; }
.rp-metric-v.warn { color: var(--on-panel-warm); }

/* 结论 */
.rp-tips { margin-top: 9px; display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.rp-tips.single { grid-template-columns: 1fr; }
.rp-tip { padding: 9px 10px; background: var(--card); border: 1px solid var(--edge); border-radius: 10px; box-shadow: 2px 2.5px 0 var(--shadow-soft); }
.rp-tip-k { color: var(--text-warm); font-size: 9.5px; font-weight: 800; }
.rp-tip-v { margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); font-size: 12px; font-weight: 900; }
.rp-tip-v .num { margin-left: 3px; font-size: 10px; color: var(--text-mid); }
.rp-tip-v .warn { color: var(--danger-text); }

/* 模块清单 */
.rp-list { margin-top: 9px; padding: 3px 12px 9px; background: var(--card); border: 1px solid var(--edge); border-radius: 12px; box-shadow: 2.5px 3px 0 var(--shadow-soft); }
.rp-list-head { display: flex; align-items: center; justify-content: space-between; padding: 9px 0 6px; }
.rp-list-title { color: var(--ink); font-size: 12px; font-weight: 900; }
.rp-list-sub { color: var(--text-3); font-size: 9.5px; font-weight: 700; }
.rp-item { padding: 8px 0; border-top: 1px solid var(--line); }
.rp-item-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.rp-item-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); font-size: 12.5px; font-weight: 900; }
.rp-item-index { margin-right: 5px; color: var(--text-3); font-size: 9.5px; font-weight: 800; }
.rp-item-time { flex: 0 0 auto; color: var(--ink); font-size: 12px; font-weight: 900; }
.rp-item-target { margin-left: 2px; color: var(--text-3); font-size: 9.5px; font-weight: 700; }
.rp-item-track { margin-top: 6px; height: 5px; overflow: hidden; background: var(--track); border-radius: 499.5px; }
.rp-item-fill { height: 100%; border-radius: 499.5px; background: var(--primary-2); }
.rp-item-fill.fill-on-track { background: var(--success); }
.rp-item-fill.fill-near { background: var(--primary-3); }
.rp-item-fill.fill-overtime { background: var(--danger); }
.rp-item-fill.fill-incomplete, .rp-item-fill.fill-skipped { background: var(--bar-incomplete); }
.rp-item-foot { margin-top: 4px; display: flex; align-items: center; justify-content: space-between; }
.rp-item-status { font-size: 9.5px; font-weight: 800; }
.s-on-track { color: var(--success-text); }
.s-near { color: var(--warn-text); }
.s-overtime { color: var(--danger-text); }
.s-incomplete, .s-skipped { color: var(--text-mid); }
.rp-item-delta { color: var(--text-mid); font-size: 10px; font-weight: 800; }
.rp-more { margin-top: 6px; padding: 8px; color: var(--text-mid); text-align: center; background: var(--cream-1); border: 1px solid var(--line-strong); border-radius: 499.5px; font-size: 10.5px; font-weight: 900; }

.rp-quote { margin-top: 11px; color: var(--text-warm); text-align: center; font-size: 11px; font-weight: 700; }

.rp-actions { margin-top: 13px; display: flex; flex-direction: column; gap: 7px; }
.rp-action-row { display: flex; gap: 6px; }
