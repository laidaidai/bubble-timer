/* 主色底上的文字统一用 --on-primary，深色主题下才看得清 */
.primary-button, .modal-confirm, .pause-button { color: var(--on-primary); }

/* ---- 公共顶栏（四个端口径一致，改这里全站生效） ---- */
.topbar { box-sizing: border-box; height: 88px; padding: 35px 14px 0; padding-top: max(35px, calc(env(safe-area-inset-top) + 3px)); display: flex; align-items: center; gap: 7px; color: var(--ink); background: var(--nav); border-bottom: 1.5px solid var(--edge); }
.topbar-title { flex: 1; min-width: 0; overflow: hidden; color: var(--ink); text-align: center; white-space: nowrap; font-size: 18px; font-weight: 900; line-height: 1.2; letter-spacing: 1px; }
.back-icon { flex: 0 0 35px; width: 35px !important; min-width: 35px !important; max-width: 35px; height: 30px; margin: 0; padding: 0; display: flex; align-items: center; justify-content: center; color: var(--ink); background: transparent; border: 0; font-size: 30px; font-weight: 300; line-height: 1; }
.topbar-spacer { flex: 0 0 35px; width: 35px; height: 30px; }

page { height: 100%; overflow: hidden; background:var(--bg); }
.timer-page { height: 100%; min-height: 0; background: var(--bg); display: flex; overflow: hidden; padding: 4px 12px; box-sizing: border-box; color:var(--ink); }
.timer-main { flex: 1; min-width: 0; height: 100%; padding: 0 12px 0 0; align-items: center; display: flex; flex-direction: column; justify-content: center; box-sizing: border-box; border-right:1px solid var(--line); }
.clock-stage { position: relative; width: 100%; padding: 11px 0 3px; display: flex; flex-direction: column; align-items: center; gap: 3px; border-radius: 14px; }

/* 翻页时钟 */
.flip-row { display: flex; align-items: center; gap: 2px; perspective: 380px; }
.flip-colon { color:var(--ink); font-size: 12px; font-weight: 900; padding: 0 0.5px; }
.flip-card { position: relative; width: 40px; height: 49px; display: flex; align-items: center; justify-content: center; background:var(--panel); border:1px solid var(--edge-deep); border-radius: 5px; box-shadow:1.5px 2px 0 var(--shadow-soft); transform-origin: center center; backface-visibility: hidden; }
.flip-card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 50%; background: linear-gradient(180deg, rgba(255, 255, 255, .08), rgba(255, 255, 255, 0)); border-radius: 5px 5px 0 0; }
.flip-split { position: absolute; left: 0; right: 0; top: 50%; height: 1px; margin-top: -0.5px; background:var(--panel-deep); }
.flip-num { color:var(--accent-text); font-family: "Courier New", "Menlo", monospace; font-size: 23px; font-weight: 900; line-height: 1; letter-spacing: 0; }
.flip-a { animation: flip-turn-a 720ms cubic-bezier(0.4, 0.05, 0.3, 1); }
.flip-b { animation: flip-turn-b 720ms cubic-bezier(0.4, 0.05, 0.3, 1); }
@keyframes flip-turn-a {
  0% { transform: rotateX(-88deg); opacity: .75; }
  50% { transform: rotateX(-12deg); opacity: .92; }
  88% { transform: rotateX(4deg); opacity: 1; }
  100% { transform: rotateX(0deg); }
}
@keyframes flip-turn-b {
  0% { transform: rotateX(-88deg); opacity: .75; }
  50% { transform: rotateX(-12deg); opacity: .92; }
  88% { transform: rotateX(4deg); opacity: 1; }
  100% { transform: rotateX(0deg); }
}

/* 积木方块 */
.block-row { display: flex; align-items: center; gap: 3px; }
.block-colon { color:var(--ink); font-size: 12px; font-weight: 900; margin: 0 0.5px; }
.block-tile { width: 21px; height: 28px; display: flex; align-items: center; justify-content: center; background:var(--card); border:1px solid var(--edge); border-radius: 5px; box-shadow:1.5px 2px 0 var(--shadow); }
.block-num { color:var(--ink); font-family: "Courier New", "Menlo", monospace; font-size: 15px; font-weight: 900; line-height: 1; }

/* 数字时钟 */
.plain-clock { display: flex; align-items: center; justify-content: center; }
.plain-num { font-family: "Courier New", "Menlo", monospace; font-weight: 900; line-height: 1; }
.clock-digital .plain-num { padding: 5px 14px; color:var(--on-panel-warm); background:var(--panel); border-radius: 9px; box-shadow:2.5px 3px 0 var(--shadow-soft), inset 0 0 15px rgba(255, 209, 102, .16); font-size: 33px; letter-spacing: 1px; text-shadow: 0 0 7px rgba(255, 209, 102, .55); }

/* 极简线条 */
.clock-minimal .plain-num { color:var(--ink); font-size: 31px; font-weight: 300; letter-spacing: 2.5px; }
.clock-minimal .clock-stage { background: transparent; }
.clock-minimal 
.stage-meta { margin-top: 0; display: flex; align-items: baseline; gap: 11px; color:var(--text-warm); font-size: 9px; }
.meta-module { color:var(--ink); font-weight: 900; }
.meta-total { margin-left: 5px; color:var(--text-2); font-size: 9px; }
.stage-progress { width: 180px; height: 4px; margin-top: 1px; overflow: hidden; background:var(--track); border:1px solid var(--edge); border-radius: 499.5px; }
.stage-progress-fill { height: 100%; background:var(--primary-2); }
.overtime-fill { background:var(--danger); }
.stage-target { width: 180px; display: flex; justify-content: space-between; color:var(--text-2); font-size: 9px; font-weight: 900; }
.on-track { color:var(--success-text); }
.overtime { color:var(--danger-text); }

.controls { margin: 3px 0 0; display: flex; justify-content: center; gap: 8px; }
.pause-button, .complete-button { flex: 0 0 29px; width: 29px; min-width: 29px; max-width: 29px; height: 29px; min-height: 29px; max-height: 29px; box-sizing: border-box; padding: 0; display: flex; align-items: center; justify-content: center; border:1.5px solid var(--edge); border-radius: 50%; box-shadow:1.5px 2px 0 var(--shadow); font-size: 13px; line-height: 1; text-align: center; }
.pause-button { color:var(--ink); background:var(--primary); }
.complete-button { position: relative; color:var(--ink); background:var(--cream-1); }
.complete-button.holding { animation: complete-hold-fill 1s linear forwards; }
@keyframes complete-hold-fill {
  from { background:var(--cream-1); }
  to { background:var(--primary); }
}
.complete-button text { position: absolute; right: 3.5px; bottom: 4.5px; font-size: 9px; font-weight: 900; }

.module-side { width: 34%; height: 100%; min-height: 0; padding-left: 12px; box-sizing: border-box; }
.module-list { min-height: 0; margin: 2px 0 3px; padding: 5.5px 6px; display: flex; align-items: center; color:var(--text-4); }
.module-list.selected { color:var(--ink); background:var(--card); border:1.5px solid var(--edge); border-radius: 10px; box-shadow:2.5px 3px 0 var(--shadow); }
.module-index { width: 15px; font-size: 10.5px; font-weight: 900; }
.module-info { display: flex; flex-direction: column; gap: 1px; font-size: 10.5px; font-weight: 800; }
.module-info text:last-child { color:var(--text-2); font-size: 9px; font-weight: 900; }

.style-hint { position: absolute; top: 0; left: 50%; display: flex; align-items: center; gap: 3px; padding: 2.5px 8px; color: var(--text-mid); background: var(--cream-2); border: 1px solid var(--line-strong); border-radius: 499.5px; font-size: 9px; font-weight: 800; white-space: nowrap; animation: hint-pop 2.6s ease forwards; }
.hint-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--primary-2); }
@keyframes hint-pop {
  0% { opacity: 0; transform: translateX(-50%) translateY(-3px); }
  14% { opacity: 1; transform: translateX(-50%) translateY(0); }
  78% { opacity: 1; transform: translateX(-50%) translateY(0); }
  100% { opacity: 0; transform: translateX(-50%) translateY(-3px); }
}

.ms-line { display: block; margin-bottom: 3px; color: var(--text-3); font-size: 9px; font-weight: 700; letter-spacing: 0.5px; line-height: 1.1; }
.ms-val { color: var(--text-2); font-family: "Courier New", Menlo, monospace; font-weight: 800; font-variant-numeric: tabular-nums; }

.next-button { flex: 0 0 auto; height: 29px; min-height: 29px; margin: 0; padding: 0 8px 0 9px; display: flex; align-items: center; gap: 3px; color: var(--ink); background: var(--cream-1); border: 1.5px solid var(--edge); border-radius: 499.5px; box-shadow: 1.5px 2px 0 var(--shadow); font-size: 9.5px; font-weight: 900; line-height: 1; white-space: nowrap; }
.next-arrow { color: var(--primary-2); font-size: 9px; }

.mode-chip { position: static; align-self: flex-start; margin: 0 0 2px 1px; display: flex; align-items: center; gap: 3px; padding: 2.5px 6px; color: var(--text-warm); background: var(--cream-1); border: 1px solid var(--line-strong); border-radius: 499.5px; font-size: 9px; font-weight: 900; }
.mode-chip.focus { color: var(--on-panel); background: var(--primary-2); border-color: var(--edge); }
.mode-chip.rest { color: var(--on-panel); background: var(--success); border-color: var(--edge); }
.mode-phase { font-size: 9px; font-weight: 900; letter-spacing: 0.5px; }

.prev-button { flex: 0 0 29px; width: 29px; min-width: 29px; max-width: 29px; height: 29px; min-height: 29px; max-height: 29px; margin: 0; padding: 0; display: flex; align-items: center; justify-content: center; color: var(--ink); background: var(--cream-1); border: 1.5px solid var(--edge); border-radius: 50%; box-shadow: 1.5px 2px 0 var(--shadow); font-size: 11px; line-height: 1; }
.prev-button.disabled { opacity: .38; }
